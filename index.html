<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>LunoTXT · GitHub TXT Manager</title>
  <!-- Font & Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
  <style>
    /* ----- CSS Variables (dark / glassmorphism) ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0b0d11;
      --bg-card: rgba(30, 34, 42, 0.7);
      --bg-card-hover: rgba(40, 45, 55, 0.8);
      --glass-border: rgba(255, 255, 255, 0.06);
      --glass-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
      --text-primary: #f0f2f5;
      --text-secondary: #a8b0c0;
      --text-muted: #6e788a;
      --accent-start: #8b5cf6;
      --accent-end: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.25);
      --success: #22c55e;
      --error: #ef4444;
      --radius-card: 24px;
      --radius-btn: 60px;
      --transition: 0.25s cubic-bezier(0.2, 0.9, 0.4, 1);
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 18px 16px 100px;
      display: flex;
      justify-content: center;
      background-image: radial-gradient(circle at 20% 30%, rgba(99, 102, 241, 0.04) 0%, transparent 60%);
    }

    .app-container {
      width: 100%;
      max-width: 720px;
    }

    /* ----- glassmorphism cards ----- */
    .glass-card {
      background: var(--bg-card);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-card);
      box-shadow: var(--glass-shadow);
      padding: 22px 20px;
      transition: background var(--transition), transform 0.15s;
    }

    /* ----- header ----- */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .brand h1 {
      font-weight: 700;
      font-size: 1.7rem;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--accent-start), var(--accent-end));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      display: inline-block;
    }

    .brand .sub {
      font-size: 0.85rem;
      color: var(--text-secondary);
      font-weight: 400;
      letter-spacing: 0.2px;
      -webkit-text-fill-color: var(--text-secondary);
      display: block;
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .header-actions i {
      font-size: 1.4rem;
      color: var(--text-secondary);
      cursor: pointer;
      transition: color var(--transition), transform 0.1s;
      padding: 6px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.02);
    }

    .header-actions i:hover {
      color: var(--text-primary);
      transform: scale(1.04);
      background: rgba(255, 255, 255, 0.04);
    }

    /* ----- floating plus button ----- */
    .fab {
      position: fixed;
      bottom: 28px;
      right: 24px;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-start), var(--accent-end));
      border: none;
      color: white;
      font-size: 2.2rem;
      box-shadow: 0 8px 28px var(--accent-glow);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 40;
      touch-action: manipulation;
    }

    .fab:hover {
      transform: scale(1.04) translateY(-2px);
      box-shadow: 0 12px 34px var(--accent-glow);
    }

    .fab:active {
      transform: scale(0.94);
    }

    /* ----- search / files section ----- */
    .section-title {
      font-weight: 600;
      font-size: 1.2rem;
      margin: 30px 0 12px 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-wrapper {
      position: relative;
      margin-bottom: 18px;
    }

    .search-wrapper i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 1rem;
    }

    .search-wrapper input {
      width: 100%;
      padding: 14px 18px 14px 46px;
      border-radius: 60px;
      border: 1px solid var(--glass-border);
      background: rgba(20, 24, 30, 0.7);
      color: var(--text-primary);
      font-size: 1rem;
      font-family: 'Inter', sans-serif;
      transition: border var(--transition), box-shadow var(--transition);
      backdrop-filter: blur(4px);
    }

    .search-wrapper input:focus {
      outline: none;
      border-color: var(--accent-start);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .search-wrapper input::placeholder {
      color: var(--text-muted);
      font-weight: 400;
    }

    /* file list */
    .file-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 6px;
    }

    .file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      padding: 16px 18px;
      background: rgba(22, 26, 34, 0.6);
      border-radius: 18px;
      border: 1px solid var(--glass-border);
      transition: background var(--transition), transform 0.12s;
      gap: 10px;
    }

    .file-item:hover {
      background: var(--bg-card-hover);
    }

    .file-info {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 2 1 160px;
    }

    .file-info i {
      font-size: 1.5rem;
      color: var(--accent-start);
    }

    .file-info .name {
      font-weight: 500;
      word-break: break-all;
      font-size: 0.95rem;
    }

    .file-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .file-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }

    .btn-icon {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      padding: 6px 10px;
      border-radius: 30px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.02);
    }

    .btn-icon:hover {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-primary);
    }

    .btn-icon.copy-success {
      color: var(--success);
    }

    .empty-state {
      text-align: center;
      padding: 40px 10px;
      color: var(--text-muted);
    }

    .empty-state i {
      font-size: 2.8rem;
      margin-bottom: 12px;
      opacity: 0.4;
    }

    /* ----- modal overlay ----- */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      width: 100%;
      max-width: 560px;
      max-height: 90vh;
      overflow-y: auto;
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 32px;
      padding: 28px 24px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);
      transform: scale(0.94) translateY(14px);
      transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1), opacity 0.25s;
      opacity: 0;
    }

    .modal-overlay.active .modal {
      transform: scale(1) translateY(0);
      opacity: 1;
    }

    .modal h2 {
      font-weight: 600;
      font-size: 1.6rem;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modal .close-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 1.6rem;
      cursor: pointer;
      margin-left: auto;
      padding: 0 6px;
    }

    .modal-header {
      display: flex;
      align-items: center;
      margin-bottom: 22px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-weight: 500;
      font-size: 0.9rem;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 14px 16px;
      border-radius: 18px;
      border: 1px solid var(--glass-border);
      background: rgba(12, 16, 22, 0.7);
      color: var(--text-primary);
      font-size: 1rem;
      font-family: 'Inter', monospace;
      transition: border var(--transition), box-shadow var(--transition);
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--accent-start);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .form-group textarea {
      min-height: 180px;
      resize: vertical;
      line-height: 1.6;
    }

    .char-count {
      text-align: right;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-start), var(--accent-end));
      border: none;
      padding: 16px 28px;
      border-radius: var(--radius-btn);
      font-weight: 600;
      font-size: 1rem;
      color: white;
      width: 100%;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 4px 16px var(--accent-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      touch-action: manipulation;
    }

    .btn-primary:active {
      transform: scale(0.97);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      transform: scale(0.98);
      pointer-events: none;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--glass-border);
      padding: 14px 20px;
      border-radius: var(--radius-btn);
      font-weight: 500;
      color: var(--text-primary);
      width: 100%;
      cursor: pointer;
      transition: background 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .success-card {
      background: rgba(34, 197, 94, 0.06);
      border: 1px solid rgba(34, 197, 94, 0.2);
      border-radius: 20px;
      padding: 20px;
      margin: 12px 0 20px;
    }

    .success-card .url {
      background: rgba(0, 0, 0, 0.3);
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 0.85rem;
      word-break: break-all;
      color: var(--text-secondary);
      font-family: monospace;
      margin: 8px 0 12px;
    }

    .flex-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .flex-row .btn-secondary,
    .flex-row .btn-primary {
      flex: 1;
      min-width: 120px;
    }

    .toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%) scale(0.9);
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      padding: 14px 28px;
      border-radius: 60px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
      color: var(--text-primary);
      font-weight: 500;
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) scale(1);
      pointer-events: auto;
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-top: 2px solid white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* settings modal */
    .settings-item {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid var(--glass-border);
    }

    .settings-item .label {
      color: var(--text-secondary);
    }

    /* responsive */
    @media (max-width: 480px) {
      body {
        padding: 12px 12px 100px;
      }
      .modal {
        padding: 20px 16px;
      }
      .brand h1 {
        font-size: 1.4rem;
      }
      .fab {
        width: 56px;
        height: 56px;
        font-size: 1.9rem;
        bottom: 20px;
        right: 16px;
      }
    }

    /* scroll */
    .modal::-webkit-scrollbar {
      width: 4px;
    }
    .modal::-webkit-scrollbar-thumb {
      background: var(--accent-start);
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="app-container" id="app">
    <!-- header -->
    <header class="header">
      <div class="brand">
        <h1>LunoTXT</h1>
        <span class="sub">GitHub TXT File Manager</span>
      </div>
      <div class="header-actions">
        <i class="fab fa-github" onclick="window.open('https://github.com/lunomodding/New','_blank')"></i>
        <i class="fas fa-cog" id="settingsIcon"></i>
      </div>
    </header>

    <!-- files dashboard -->
    <section>
      <div class="section-title"><i class="fas fa-file-alt" style="color:var(--accent-start);"></i> Your TXT Files</div>
      <div class="search-wrapper">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Search files..." />
      </div>
      <div id="fileList" class="file-list">
        <!-- dynamic -->
        <div class="empty-state"><i class="fas fa-cloud-upload-alt"></i><br />Loading files...</div>
      </div>
    </section>

    <!-- floating + -->
    <button class="fab" id="fabBtn"><i class="fas fa-plus"></i></button>

    <!-- toast -->
    <div id="toast" class="toast"></div>
  </div>

  <!-- ====== MODAL ====== -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modalContent">
      <!-- dynamic content -->
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // ---------- CONFIG ----------
      const CONFIG = {
        owner: 'lunomodding',
        repo: 'New',
        branch: 'main',
        // In production, token MUST be server-side. 
        // For demo, we use a proxy or serverless. This frontend will call a secure backend.
        // We'll simulate a secure API by using a placeholder endpoint.
        // Replace with your serverless function URL that proxies to GitHub.
        API_BASE: 'https://api.github.com',  // direct GitHub API (will fail without token) 
        // For real security, set your proxy endpoint:
        // PROXY_URL: 'https://your-serverless-function.com/github-proxy'
      };

      // We'll use a proxy pattern: if no token, we show error. 
      // User must set a backend proxy or use a token (INSECURE - for demo only)
      // To keep it secure, we will not embed token. 
      // Instead we show a warning and use a dummy token to trigger auth error.
      // In production, configure a secure backend.

      // For demonstration, we use a dummy token to show the flow.
      // The user should replace with their own secure proxy.
      const GITHUB_TOKEN = ''; // NEVER hardcode in production. Use backend proxy.
      const USE_PROXY = false; // set true if you have a backend

      // DOM refs
      const fileListEl = document.getElementById('fileList');
      const searchInput = document.getElementById('searchInput');
      const fabBtn = document.getElementById('fabBtn');
      const modalOverlay = document.getElementById('modalOverlay');
      const modalContent = document.getElementById('modalContent');
      const toastEl = document.getElementById('toast');

      let toastTimeout = null;
      let currentFiles = [];

      // ---------- HELPERS ----------
      function showToast(msg, duration = 2800) {
        if (toastTimeout) clearTimeout(toastTimeout);
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        toastTimeout = setTimeout(() => {
          toastEl.classList.remove('show');
          toastTimeout = null;
        }, duration);
      }

      function closeModal() {
        modalOverlay.classList.remove('active');
      }

      function openModal(html) {
        modalContent.innerHTML = html;
        modalOverlay.classList.add('active');
        // attach events inside modal after render
      }

      function githubRawUrl(filename) {
        return `https://raw.githubusercontent.com/${CONFIG.owner}/${CONFIG.repo}/refs/heads/${CONFIG.branch}/${filename}`;
      }

      // ---------- API (secure via proxy or token) ----------
      async function githubRequest(endpoint, options = {}) {
        const url = `${CONFIG.API_BASE}${endpoint}`;
        const headers = {
          'Accept': 'application/vnd.github.v3+json',
          ...options.headers
        };
        if (GITHUB_TOKEN) {
          headers['Authorization'] = `token ${GITHUB_TOKEN}`;
        } else {
          // No token: we warn and use a fake token to trigger error, or if proxy not set
          // In real app, use a serverless proxy. 
          // We'll simulate by showing an error if no token and no proxy.
          if (!USE_PROXY) {
            throw new Error('GitHub token not configured. Please set up a secure backend or add token (not recommended).');
          }
        }
        const resp = await fetch(url, { ...options, headers });
        if (!resp.ok) {
          let errMsg = `GitHub API error ${resp.status}`;
          try {
            const data = await resp.json();
            if (data.message) errMsg = data.message;
          } catch (_) { /* ignore */ }
          throw new Error(errMsg);
        }
        return resp.json();
      }

      // Get contents of repo (files)
      async function fetchFiles() {
        try {
          const data = await githubRequest(`/repos/${CONFIG.owner}/${CONFIG.repo}/contents?ref=${CONFIG.branch}`);
          // filter .txt files
          const txtFiles = data.filter(item => item.name.endsWith('.txt') && item.type === 'file');
          return txtFiles.map(item => ({
            name: item.name,
            size: item.size,
            updated: item.sha ? new Date().toLocaleDateString() : '—', // no commit date from contents api easily
            download_url: item.download_url,
            raw: githubRawUrl(item.name)
          }));
        } catch (err) {
          console.warn('fetch error', err);
          throw err;
        }
      }

      // Create file
      async function createFile(filename, content) {
        const encoded = btoa(unescape(encodeURIComponent(content))); // base64
        const payload = {
          message: `Create ${filename}`,
          content: encoded,
          branch: CONFIG.branch
        };
        const endpoint = `/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${filename}`;
        const options = {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        };
        return githubRequest(endpoint, options);
      }

      // ---------- RENDER FILES ----------
      function renderFiles(files) {
        currentFiles = files;
        const searchTerm = searchInput.value.toLowerCase().trim();
        const filtered = files.filter(f => f.name.toLowerCase().includes(searchTerm));

        if (filtered.length === 0) {
          fileListEl.innerHTML = `<div class="empty-state"><i class="fas fa-file-alt"></i><br />No .txt files found</div>`;
          return;
        }

        fileListEl.innerHTML = filtered.map(file => `
          <div class="file-item" data-filename="${file.name}">
            <div class="file-info">
              <i class="fas fa-file-alt"></i>
              <span class="name">${file.name}</span>
              <span class="file-meta">${file.size ? (file.size/1024).toFixed(1)+' KB' : ''}</span>
            </div>
            <div class="file-actions">
              <button class="btn-icon copy-raw-btn" data-url="${file.raw}" title="Copy Raw URL"><i class="fas fa-copy"></i></button>
              <button class="btn-icon open-raw-btn" data-url="${file.raw}" title="Open Raw"><i class="fas fa-external-link-alt"></i></button>
            </div>
          </div>
        `).join('');

        // attach copy/open events
        document.querySelectorAll('.copy-raw-btn').forEach(btn => {
          btn.addEventListener('click', function(e) {
            e.stopPropagation();
            const url = this.dataset.url;
            navigator.clipboard.writeText(url).then(() => {
              showToast('Raw link copied to clipboard');
              this.classList.add('copy-success');
              setTimeout(() => this.classList.remove('copy-success'), 1200);
            }).catch(() => showToast('Failed to copy', 2000));
          });
        });

        document.querySelectorAll('.open-raw-btn').forEach(btn => {
          btn.addEventListener('click', function(e) {
            e.stopPropagation();
            window.open(this.dataset.url, '_blank');
          });
        });
      }

      async function loadFiles() {
        try {
          fileListEl.innerHTML = `<div class="empty-state"><i class="fas fa-spinner fa-pulse"></i><br />Loading...</div>`;
          const files = await fetchFiles();
          renderFiles(files);
        } catch (err) {
          fileListEl.innerHTML = `<div class="empty-state" style="color:var(--error);"><i class="fas fa-exclamation-circle"></i><br />${err.message || 'Could not load files'}</div>`;
          showToast('Error loading files: ' + err.message, 3000);
        }
      }

      // ---------- MODAL: CREATE ----------
      function showCreateModal() {
        const html = `
          <div class="modal-header">
            <h2><i class="fas fa-plus-circle" style="color:var(--accent-start);"></i> Create TXT</h2>
            <button class="close-btn" id="closeModalBtn"><i class="fas fa-times"></i></button>
          </div>
          <div id="createForm">
            <div class="form-group">
              <label>Filename <span style="color:var(--text-muted);">(auto .txt)</span></label>
              <input type="text" id="filenameInput" placeholder="demo" value="demo" />
            </div>
            <div class="form-group">
              <label>Content</label>
              <textarea id="contentInput" placeholder="Write your text here...">Hello, LunoTXT!</textarea>
              <div class="char-count"><span id="charCount">0</span> characters</div>
            </div>
            <button class="btn-primary" id="createBtn"><i class="fas fa-upload"></i> Create File 🚀</button>
            <div style="margin-top:12px; text-align:center; color:var(--text-muted); font-size:0.8rem;">File will be saved to main branch</div>
          </div>
          <div id="successResult" style="display:none;"></div>
        `;
        openModal(html);

        // after open: bind events
        const closeBtn = document.getElementById('closeModalBtn');
        if (closeBtn) closeBtn.addEventListener('click', closeModal);

        const filenameInput = document.getElementById('filenameInput');
        const contentInput = document.getElementById('contentInput');
        const charCount = document.getElementById('charCount');
        const createBtn = document.getElementById('createBtn');
        const createForm = document.getElementById('createForm');
        const successResult = document.getElementById('successResult');

        function updateCharCount() {
          charCount.textContent = contentInput.value.length;
        }
        contentInput.addEventListener('input', updateCharCount);
        updateCharCount();

        // sanitize filename
        function sanitizeFilename(name) {
          let f = name.trim();
          if (!f) return '';
          // remove invalid chars (simple)
          f = f.replace(/[^a-zA-Z0-9_.-]/g, '');
          // append .txt if not present
          if (!f.endsWith('.txt')) f += '.txt';
          // prevent double .txt
          if (f.endsWith('.txt.txt')) f = f.slice(0, -4);
          return f;
        }

        createBtn.addEventListener('click', async function() {
          let rawName = filenameInput.value.trim();
          if (!rawName) {
            showToast('Filename cannot be empty', 2000);
            return;
          }
          const filename = sanitizeFilename(rawName);
          if (!filename) {
            showToast('Invalid filename', 2000);
            return;
          }
          const content = contentInput.value;
          if (!content.trim()) {
            showToast('Content cannot be empty', 2000);
            return;
          }

          // check if file already exists in currentFiles
          if (currentFiles.some(f => f.name === filename)) {
            showToast(`File "${filename}" already exists. Cancel or rename.`, 3000);
            return;
          }

          createBtn.disabled = true;
          createBtn.innerHTML = `<span class="spinner"></span> Creating...`;

          try {
            await createFile(filename, content);
            // success
            const rawUrl = githubRawUrl(filename);
            createForm.style.display = 'none';
            successResult.style.display = 'block';
            successResult.innerHTML = `
              <div class="success-card">
                <i class="fas fa-check-circle" style="color:var(--success); font-size:1.6rem;"></i>
                <h3 style="margin:6px 0;">File Created Successfully</h3>
                <div><strong>${filename}</strong></div>
                <div class="url">${rawUrl}</div>
                <div class="flex-row">
                  <button class="btn-secondary" id="copyRawSuccess"><i class="fas fa-copy"></i> Copy Raw Link</button>
                  <button class="btn-secondary" id="openRawSuccess"><i class="fas fa-external-link-alt"></i> Open Raw</button>
                </div>
                <button class="btn-primary" id="createAnotherBtn" style="margin-top:16px;"><i class="fas fa-plus"></i> Create Another</button>
              </div>
            `;
            // attach success buttons
            document.getElementById('copyRawSuccess').addEventListener('click', function() {
              navigator.clipboard.writeText(rawUrl).then(() => {
                showToast('Raw link copied to clipboard');
                this.innerHTML = '<i class="fas fa-check"></i> Copied';
                setTimeout(() => this.innerHTML = '<i class="fas fa-copy"></i> Copy Raw Link', 1800);
              });
            });
            document.getElementById('openRawSuccess').addEventListener('click', function() {
              window.open(rawUrl, '_blank');
            });
            document.getElementById('createAnotherBtn').addEventListener('click', function() {
              closeModal();
              setTimeout(showCreateModal, 200);
            });

            // refresh files
            loadFiles();
            showToast('File created!', 2000);

          } catch (err) {
            showToast('Error: ' + err.message, 3500);
            createBtn.disabled = false;
            createBtn.innerHTML = `<i class="fas fa-upload"></i> Create File 🚀`;
          }
        });

        // close on overlay click
        modalOverlay.addEventListener('click', function(e) {
          if (e.target === modalOverlay) closeModal();
        });
      }

      // ---------- SETTINGS MODAL ----------
      function showSettingsModal() {
        const html = `
          <div class="modal-header">
            <h2><i class="fas fa-cog"></i> Settings</h2>
            <button class="close-btn" id="closeSettingsBtn"><i class="fas fa-times"></i></button>
          </div>
          <div class="settings-item"><span class="label">GitHub Username</span> <span>${CONFIG.owner}</span></div>
          <div class="settings-item"><span class="label">Repository</span> <span>${CONFIG.repo}</span></div>
          <div class="settings-item"><span class="label">Branch</span> <span>${CONFIG.branch}</span></div>
          <div class="settings-item"><span class="label">API</span> <span>${GITHUB_TOKEN ? 'Token configured (insecure)' : '🔐 Secure proxy recommended'}</span></div>
          <div style="margin-top:20px; color:var(--text-secondary); font-size:0.85rem; border-top:1px solid var(--glass-border); padding-top:16px;">
            <i class="fas fa-shield-alt" style="color:var(--accent-start);"></i> 
            For production, use a secure backend / serverless function to keep your GitHub token private.
          </div>
          <button class="btn-secondary" id="closeSettingsBtn2" style="margin-top:20px;">Close</button>
        `;
        openModal(html);
        document.getElementById('closeSettingsBtn')?.addEventListener('click', closeModal);
        document.getElementById('closeSettingsBtn2')?.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', function(e) {
          if (e.target === modalOverlay) closeModal();
        });
      }

      // ---------- EVENTS ----------
      fabBtn.addEventListener('click', showCreateModal);
      document.getElementById('settingsIcon').addEventListener('click', showSettingsModal);

      searchInput.addEventListener('input', function() {
        renderFiles(currentFiles);
      });

      // load files on startup
      loadFiles();

      // close modal on escape
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeModal();
      });

      // Handle token warning
      if (!GITHUB_TOKEN && !USE_PROXY) {
        setTimeout(() => {
          showToast('⚠️ No GitHub token. Set up a secure backend or add token (insecure).', 5000);
        }, 800);
      }

      // expose for debugging
      window.__debug = { CONFIG, loadFiles };

    })();
  </script>
</body>
</html>
